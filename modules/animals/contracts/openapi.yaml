openapi: 3.0.3
info:
  title: Pixkki Animals API
  version: 1.2.0
  description: Contrato de la API del módulo animals (ingresos y expedientes clínicos).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: animals
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-${project-ref}-auth-token
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: {}
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message, statusCode]
          properties:
            code: { type: string }
            message: { type: string }
            statusCode: { type: integer }
    CreateAnimalRequest:
      type: object
      required: [especie, procedencia, rasgosFisicos, estadoInicial, idEstado, idEspacio]
      properties:
        nombre: { type: string, maxLength: 100 }
        especie: { type: string, enum: [Perro, Gato] }
        raza: { type: string, maxLength: 80 }
        sexo: { type: string, enum: [M, H] }
        edadEstimada: { type: integer, minimum: 0, maximum: 300 }
        peso: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 500 }
        procedencia: { type: string, minLength: 2, maxLength: 200 }
        rasgosFisicos: { type: string, minLength: 2, maxLength: 500 }
        estadoInicial: { type: string, minLength: 2, maxLength: 100 }
        idEstado: { type: integer, minimum: 1 }
        idEspacio: { type: integer, minimum: 1 }
        idRefugio: { type: integer, minimum: 1 }
        color: { type: string, maxLength: 50 }
        tamano: { type: string, enum: [Pequeño, Mediano, Grande] }
        microchip: { type: string, pattern: "^[A-Za-z0-9-]{9,20}$" }
        temperamento: { type: string, enum: [Dócil, Sociable, Tímido, Miedoso, Reactivo, Agresivo] }
        lugarRescate: { type: string, minLength: 2, maxLength: 200 }
        fechaRescate: { type: string, format: date }
        situacionRescate: { type: string, enum: [Abandonado, Extraviado, Maltratado, Nacido en la calle, Accidentado, Otro] }
        rescatistaNombre: { type: string, minLength: 2, maxLength: 100 }
        rescatistaContacto: { type: string, minLength: 3, maxLength: 100 }
        observaciones: { type: string, maxLength: 1000 }
        enCuarentena:
          type: boolean
          default: true
          readOnly: true
          description: >-
            RF2.4: todo ingreso nace en cuarentena y el flag no se puede cambiar
            por creación ni edición. Solo el alta médica lo libera.
        esterilizado: { type: boolean, default: false }
        disponibleAdopcion: { type: boolean, default: false }
        activo: { type: boolean, default: true }
        vacunado: { type: boolean, default: false }
        desparasitado: { type: boolean, default: false }
    UploadImageRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: binary }
    CreateDiagnosticoRequest:
      type: object
      required: [estadoGeneral]
      properties:
        estadoGeneral: { type: string, enum: [Crítico, Delicado, Estable, Sano] }
        observaciones: { type: string, maxLength: 2000 }
    Animal:
      type: object
      properties:
        idAnimal: { type: integer }
        uuid: { type: string, nullable: true }
        idRefugio: { type: integer }
        refugioNombre: { type: string, nullable: true }
        idEspacio: { type: integer }
        espacioNombre: { type: string, nullable: true }
        idEstado: { type: integer }
        estadoNombre: { type: string, nullable: true }
        nombre: { type: string, nullable: true }
        especie: { type: string }
        raza: { type: string, nullable: true }
        sexo: { type: string, nullable: true }
        edadEstimada: { type: integer, nullable: true }
        peso: { type: number, nullable: true }
        procedencia: { type: string }
        rasgosFisicos: { type: string }
        estadoInicial: { type: string }
        fechaIngreso: { type: string, format: date-time }
        activo: { type: boolean }
        disponibleAdopcion: { type: boolean }
        enCuarentena: { type: boolean }
        esterilizado: { type: boolean }
        deletedAt: { type: string, nullable: true }
        color: { type: string, nullable: true }
        tamano: { type: string, nullable: true }
        microchip: { type: string, nullable: true }
        temperamento: { type: string, nullable: true }
        vacunado: { type: boolean }
        desparasitado: { type: boolean }
        lugarRescate: { type: string, nullable: true }
        fechaRescate: { type: string, format: date, nullable: true }
        situacionRescate: { type: string, nullable: true }
        rescatistaNombre: { type: string, nullable: true }
        rescatistaContacto: { type: string, nullable: true }
        observaciones: { type: string, nullable: true }
    AnimalImage:
      type: object
      properties:
        idImagen: { type: integer }
        idAnimal: { type: integer }
        urlPublica: { type: string }
        urlThumbnail: { type: string, nullable: true }
        esPortada: { type: boolean }
        orden: { type: integer }
        formato: { type: string, nullable: true }
        tamanoBytes: { type: integer, nullable: true }
        nombreArchivo: { type: string }
        fechaSubida: { type: string, format: date-time }
    Diagnostico:
      type: object
      properties:
        idDiagnostico: { type: integer }
        idAnimal: { type: integer }
        estadoGeneral: { type: string, enum: [Crítico, Delicado, Estable, Sano] }
        requiereCuarentena:
          type: boolean
          deprecated: true
          description: Registro histórico. No refleja ni altera `animal.enCuarentena` después de RF2.4.
        observaciones: { type: string, nullable: true }
        tratamientoInicial: { type: string, nullable: true }
        requiereCirugia: { type: boolean }
        idUsuarioVeterinario: { type: integer }
        fechaDiagnostico: { type: string, format: date-time }
    ClinicalRecord:
      type: object
      properties:
        animal: { $ref: "#/components/schemas/Animal" }
        imagenes: { type: array, items: { $ref: "#/components/schemas/AnimalImage" } }
        diagnosticos: { type: array, items: { $ref: "#/components/schemas/Diagnostico" } }
        alertas: { type: array, items: { type: string, enum: [cuarentena, estado_critico] } }
        lineaTiempo: { type: array, items: { type: object } }
    AnimalResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Animal" } }
    AnimalListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                animales: { type: array, items: { $ref: "#/components/schemas/Animal" } }
                total: { type: integer }
                page: { type: integer }
                pageSize: { type: integer }
    AnimalImageListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                imagenes: { type: array, items: { $ref: "#/components/schemas/AnimalImage" } }
    AnimalImageResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                imagen: { $ref: "#/components/schemas/AnimalImage" }
    DiagnosticoResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                diagnostico: { $ref: "#/components/schemas/Diagnostico" }
    DiagnosticoListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                diagnosticos: { type: array, items: { $ref: "#/components/schemas/Diagnostico" } }
    ClinicalRecordResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ClinicalRecord" }
    Chequeo:
      type: object
      properties:
        idChequeo: { type: integer }
        idAnimal: { type: integer }
        idRefugio: { type: integer }
        pesoKg: { type: number }
        temperaturaC: { type: number }
        frecuenciaCardiaca: { type: integer }
        frecuenciaRespiratoria: { type: integer }
        sintomas: { type: array, items: { type: string } }
        sintomaOtroDetalle: { type: string, nullable: true }
        observaciones: { type: string, nullable: true }
        idUsuario: { type: integer }
        fechaChequeo: { type: string, format: date-time }
    CreateChequeoRequest:
      type: object
      required: [peso_kg, temperatura_c, frecuencia_cardiaca, frecuencia_respiratoria]
      properties:
        peso_kg: { type: number, exclusiveMinimum: 0, maximum: 200 }
        temperatura_c: { type: number, minimum: 30, maximum: 45 }
        frecuencia_cardiaca: { type: integer, minimum: 20, maximum: 300 }
        frecuencia_respiratoria: { type: integer, minimum: 5, maximum: 150 }
        sintomas:
          type: array
          items: { type: string, enum: [vomito, diarrea, letargia, secrecion_nasal_ocular, tos, otro] }
        sintoma_otro_detalle: { type: string, nullable: true }
        observaciones: { type: string, nullable: true }
        fecha_chequeo: { type: string, format: date-time }
    AltaCuarentena:
      type: object
      properties:
        idAlta: { type: integer }
        idAnimal: { type: integer }
        idRefugio: { type: integer }
        observaciones: { type: string }
        idUsuarioVeterinario: { type: integer }
        fechaAlta: { type: string, format: date-time }
        enCuarentena: { type: boolean }
    CreateAltaCuarentenaRequest:
      type: object
      required: [observaciones]
      properties:
        observaciones: { type: string }
        fecha_alta: { type: string, format: date-time }
    EstadoCuarentena:
      type: object
      properties:
        idAnimal: { type: integer }
        enCuarentena: { type: boolean }
        alerta:
          nullable: true
          type: object
          properties:
            codigo: { type: string }
            color: { type: string }
            texto: { type: string }
        fechaIngreso: { type: string, format: date-time }
        alta: { nullable: true }
        historialAltas: { type: array, items: { type: object } }
  responses:
    ValidationError: { description: "400", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: "401", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: "403", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: "404", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
paths:
  /animales:
    post:
      tags: [animals]
      summary: Alta de paciente y expediente (JSON, sin imágenes).
      operationId: createAnimal
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateAnimalRequest" } } } }
      responses:
        "201": { description: Animal creado, content: { application/json: { schema: { $ref: "#/components/schemas/AnimalResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [animals]
      summary: Listar animales del refugio en sesión.
      operationId: listAnimals
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: Lista, content: { application/json: { schema: { $ref: "#/components/schemas/AnimalListResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /animales/{id}:
    get:
      tags: [animals]
      summary: Obtener animal por ID.
      operationId: getAnimalById
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Animal, content: { application/json: { schema: { $ref: "#/components/schemas/AnimalResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /animales/{id}/imagenes:
    get:
      tags: [animals]
      summary: Listar imágenes.
      operationId: listAnimalImages
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Imágenes, content: { application/json: { schema: { $ref: "#/components/schemas/AnimalImageListResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [animals]
      summary: Subir imágenes.
      operationId: uploadAnimalImages
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: "#/components/schemas/UploadImageRequest" } } } }
      responses:
        "201": { description: Imágenes subidas, content: { application/json: { schema: { $ref: "#/components/schemas/AnimalImageListResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /animales/{id}/imagenes/{idImagen}:
    delete:
      tags: [animals]
      summary: Eliminar imagen.
      operationId: deleteAnimalImage
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: idImagen, required: true, schema: { type: integer } }
      responses:
        "200": { description: Eliminada, content: { application/json: { schema: { type: object, properties: { success: { type: boolean, enum: [true] }, data: { type: object, properties: { eliminada: { type: boolean } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /animales/{id}/imagenes/{idImagen}/portada:
    patch:
      tags: [animals]
      summary: Designar portada.
      operationId: setAnimalImagePortada
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: idImagen, required: true, schema: { type: integer } }
      responses:
        "200": { description: Portada actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/AnimalImageResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /animales/{id}/diagnosticos:
    get:
      tags: [animals]
      summary: Listar diagnósticos.
      operationId: listDiagnosticos
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Diagnósticos, content: { application/json: { schema: { $ref: "#/components/schemas/DiagnosticoListResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [animals]
      summary: Registrar diagnóstico.
      operationId: createDiagnostico
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateDiagnosticoRequest" } } } }
      responses:
        "201": { description: Diagnóstico creado, content: { application/json: { schema: { $ref: "#/components/schemas/DiagnosticoResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /animales/{id}/ficha-clinica:
    get:
      tags: [animals]
      summary: Ficha clínica centralizada.
      operationId: getClinicalRecord
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Ficha clínica, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalRecordResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /animales/{id}/chequeos:
    get:
      tags: [animals]
      summary: Listar chequeos médicos del paciente.
      operationId: listAnimalCheckups
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Chequeos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      chequeos:
                        type: array
                        items: { $ref: "#/components/schemas/Chequeo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [animals]
      summary: Registrar chequeo médico y constantes vitales.
      operationId: createAnimalCheckup
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChequeoRequest" }
      responses:
        "201":
          description: Chequeo creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      chequeo: { $ref: "#/components/schemas/Chequeo" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /animales/{id}/cuarentena:
    get:
      tags: [animals]
      summary: Consultar estado de cuarentena y alerta.
      operationId: getAnimalQuarantineStatus
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Estado de cuarentena
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/EstadoCuarentena" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /animales/{id}/alta-cuarentena:
    post:
      tags: [animals]
      summary: Registrar alta médica de cuarentena.
      operationId: releaseAnimalQuarantine
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAltaCuarentenaRequest" }
      responses:
        "201":
          description: Alta registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      alta: { $ref: "#/components/schemas/AltaCuarentena" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "409", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
